name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Allows the auto-release job in ci.yml to dispatch this workflow explicitly
  # after pushing a tag with GITHUB_TOKEN, which does not trigger push events.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, Package & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # --- Setup for GitHub Release + tarball ---
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Set library version
        working-directory: projects/ngx-streaming-player
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build library
        run: npm run build:lib

      - name: Pack library tarball
        id: pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist/ngx-streaming-player
          npm pack
          TARBALL="ngx-streaming-player-${VERSION}.tgz"
          mv "ngx-streaming-player-${VERSION}.tgz" "../../${TARBALL}"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # ── Generate release notes from conventional commits ──────────────────────
      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail

          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          PREV_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | grep -v "^${TAG}$" | tail -1 || true)
          [ -z "$PREV_TAG" ] && RANGE="HEAD" || RANGE="${PREV_TAG}..HEAD"

          {
            echo "## What's Changed in ${TAG}"
            echo ""

            BREAKING=$(git log "$RANGE" --format="%s" | grep -E '^[a-z]+(\([^)]*\))?!:' | sed 's/^[^:]*: //' || true)
            if [ -n "$BREAKING" ]; then
              echo "### Breaking Changes"
              while IFS= read -r l; do [ -n "$l" ] && echo "- $l"; done <<< "$BREAKING"
              echo ""
            fi

            FEATS=$(git log "$RANGE" --format="%s" | grep -E '^feat(\([^)]*\))?:' | sed 's/^feat[^:]*: //' || true)
            if [ -n "$FEATS" ]; then
              echo "### New Features"
              while IFS= read -r l; do [ -n "$l" ] && echo "- $l"; done <<< "$FEATS"
              echo ""
            fi

            FIXES=$(git log "$RANGE" --format="%s" | grep -E '^fix(\([^)]*\))?:' | sed 's/^fix[^:]*: //' || true)
            if [ -n "$FIXES" ]; then
              echo "### Bug Fixes"
              while IFS= read -r l; do [ -n "$l" ] && echo "- $l"; done <<< "$FIXES"
              echo ""
            fi

            REFACTORS=$(git log "$RANGE" --format="%s" | grep -E '^refactor(\([^)]*\))?:' | sed 's/^refactor[^:]*: //' || true)
            if [ -n "$REFACTORS" ]; then
              echo "### Refactoring"
              while IFS= read -r l; do [ -n "$l" ] && echo "- $l"; done <<< "$REFACTORS"
              echo ""
            fi

            SECURITY=$(git log "$RANGE" --format="%s" | grep -E '^security(\([^)]*\))?:' | sed 's/^security[^:]*: //' || true)
            if [ -n "$SECURITY" ]; then
              echo "### Security"
              while IFS= read -r l; do [ -n "$l" ] && echo "- $l"; done <<< "$SECURITY"
              echo ""
            fi

            PERF=$(git log "$RANGE" --format="%s" | grep -E '^perf(\([^)]*\))?:' | sed 's/^perf[^:]*: //' || true)
            if [ -n "$PERF" ]; then
              echo "### Performance"
              while IFS= read -r l; do [ -n "$l" ] && echo "- $l"; done <<< "$PERF"
              echo ""
            fi

            if [ -n "$PREV_TAG" ]; then
              echo "---"
              echo "**Full changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
              echo ""
            fi

            echo "### Install or upgrade"
            echo ""
            echo '```bash'
            echo "npm install ngx-streaming-player@${TAG#v}"
            echo '```'
          } > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          name: "v${{ steps.pack.outputs.version }}"
          body_path: release_notes.md
          files: ${{ steps.pack.outputs.tarball }}
          draft: false
          prerelease: false
          make_latest: true

      # --- Publish to npm ---
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish --access public
        working-directory: dist/ngx-streaming-player
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
