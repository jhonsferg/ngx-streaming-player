sonar.projectKey=ngx-streaming-player
sonar.projectName=ngx-streaming-player
sonar.host.url=http://localhost:9000

sonar.sources=projects
sonar.tests=projects
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts

sonar.javascript.lcov.reportPaths=coverage/showcase/lcov.info,coverage/ngx-streaming-player/lcov.info
sonar.typescript.lcov.reportPaths=coverage/showcase/lcov.info,coverage/ngx-streaming-player/lcov.info

# Templates/styles aren't executable code; measuring "coverage" on them just
# reports a permanent 0% and distorts the project-wide percentage.
sonar.coverage.exclusions=**/*.html,**/*.scss,**/*.css
sonar.typescript.tsconfigPath=tsconfig.json
sonar.eslint.reportPaths=eslint-report.json
